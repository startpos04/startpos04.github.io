<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StartPOS — Loading</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0a0a0a;
        --fg: #f4f4f5;
        --muted: #a1a1aa;
        --border: #27272a;
        --primary: #10b981;
        --primary-dim: rgba(16, 185, 129, 0.15);
        --radius: 12px;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f9fafb;
          --fg: #111827;
          --muted: #6b7280;
          --border: #e5e7eb;
          --primary-dim: rgba(16, 185, 129, 0.12);
        }
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: var(--bg);
        color: var(--fg);
      }

      .card {
        max-width: 360px;
        width: 100%;
        text-align: center;
      }

      /* Brand logo */
      .logo {
        width: 52px;
        height: 52px;
        margin: 0 auto 20px;
        background: var(--primary);
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .logo svg { width: 28px; height: 28px; }

      /* Spinner ring */
      .spinner-wrap {
        position: relative;
        width: 56px;
        height: 56px;
        margin: 0 auto 20px;
      }
      .spinner {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        border: 3px solid var(--border);
        border-top-color: var(--primary);
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      h1 {
        font-size: 18px;
        font-weight: 600;
        margin-bottom: 8px;
        letter-spacing: -0.01em;
      }
      p {
        font-size: 13px;
        line-height: 1.6;
        color: var(--muted);
        margin-bottom: 20px;
      }

      /* Status pill */
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: var(--muted);
        background: var(--primary-dim);
        border: 1px solid var(--border);
        padding: 5px 12px;
        border-radius: 99px;
        margin-bottom: 20px;
      }
      .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--primary);
        animation: pulse 2s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }
      .dot.offline { background: #ef4444; animation: none; }

      /* Retry button — only shown when truly stuck */
      .retry-btn {
        display: none;
        appearance: none;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--fg);
        font-size: 13px;
        font-weight: 500;
        padding: 8px 18px;
        border-radius: 8px;
        cursor: pointer;
        transition: background 0.15s;
      }
      .retry-btn:hover { background: var(--border); }
      .retry-btn.visible { display: inline-block; }

      .hint {
        font-size: 11px;
        color: var(--muted);
        margin-top: 14px;
        opacity: 0;
        transition: opacity 0.4s;
      }
      .hint.visible { opacity: 1; }
    </style>
  </head>
  <body>
    <div class="card">
      <!-- Brand mark -->
      <div class="logo">
        <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M6 5L4 9v14a2 2 0 002 2h20a2 2 0 002-2V9L26 5z" stroke="white" stroke-width="2" stroke-linejoin="round" fill="none"/>
          <line x1="4" y1="9" x2="28" y2="9" stroke="white" stroke-width="2"/>
          <path d="M20 13a4 4 0 01-8 0" stroke="white" stroke-width="2" stroke-linecap="round" fill="none"/>
        </svg>
      </div>

      <!-- Spinner -->
      <div class="spinner-wrap">
        <div class="spinner" id="spinner"></div>
      </div>

      <h1 id="heading">Loading offline mode</h1>
      <p id="body">The app is loading from your local cache.<br>This only takes a moment.</p>

      <!-- Status pill -->
      <div class="pill">
        <span class="dot" id="dot"></span>
        <span id="status-text">Restoring your session…</span>
      </div>

      <!-- Retry — shown after 6s if something went wrong -->
      <br>
      <button class="retry-btn" id="retry-btn" onclick="window.location.reload()">Reload</button>
      <p class="hint" id="hint">Taking longer than expected? Try reloading.</p>
    </div>

    <script>
      var dot        = document.getElementById('dot')
      var statusText = document.getElementById('status-text')
      var heading    = document.getElementById('heading')
      var body       = document.getElementById('body')
      var retryBtn   = document.getElementById('retry-btn')
      var hint       = document.getElementById('hint')
      var spinner    = document.getElementById('spinner')

      // If the browser is actually online (SW not yet ready, first install),
      // attempt a reload immediately — the SW might claim the page in <200ms.
      if (navigator.onLine) {
        // Give the SW 800ms to claim this page before we flash the UI
        setTimeout(function () {
          window.location.reload()
        }, 800)
      }

      // Auto-reload the moment connectivity returns
      window.addEventListener('online', function () {
        statusText.textContent = 'Back online — reloading…'
        dot.classList.remove('offline')
        window.location.reload()
      })

      // Update pill if the user goes offline while on this page
      window.addEventListener('offline', function () {
        dot.classList.add('offline')
        statusText.textContent = 'No internet connection'
      })

      // After 6s, surface the retry button and hint in case loading stalled
      setTimeout(function () {
        retryBtn.classList.add('visible')
        hint.classList.add('visible')
        statusText.textContent = 'Waiting for cached app…'
      }, 6000)
    </script>
  </body>
</html>
